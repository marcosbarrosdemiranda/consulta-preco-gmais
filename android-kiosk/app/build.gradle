plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionPropertiesFile = file('version.properties')
Properties versionProps = new Properties()
if (versionPropertiesFile.exists()) {
    versionProps.load(new FileInputStream(versionPropertiesFile))
}

int major = versionProps.getProperty("VERSION_MAJOR", "1").toInteger()
int minor = versionProps.getProperty("VERSION_MINOR", "0").toInteger()
int patch = versionProps.getProperty("VERSION_PATCH", "0").toInteger()
int buildCode = versionProps.getProperty("VERSION_CODE", "1").toInteger()

// Auto-increment patch and versionCode on every build
patch++
buildCode++

versionProps.setProperty("VERSION_MAJOR", major.toString())
versionProps.setProperty("VERSION_MINOR", minor.toString())
versionProps.setProperty("VERSION_PATCH", patch.toString())
versionProps.setProperty("VERSION_CODE", buildCode.toString())
versionProps.store(new FileOutputStream(versionPropertiesFile), null)

String computedVersionName = "${major}.${minor}.${patch}"

android {
    namespace 'br.com.gmais.consultapreco'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.gmais.consultapreco"
        minSdk 24
        targetSdk 34
        versionCode buildCode
        versionName computedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
